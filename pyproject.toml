[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchattack"
version = "0.1.0"
description = "Embedding-space universal adversarial patch attack (DINOv2 + on-device CNNs), targeting banana"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "requests>=2.31",
    "pillow>=10.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.optional-dependencies]
# CLIP/SigLIP ensemble members (models.py) + VLM transfer eval (eval_vlm.py)
vlm = [
    "open_clip_torch>=2.24",
    "transformers>=5.0",  # eval_vlm uses the v5 dtype=/processor_kwargs API
    "accelerate",
    "num2words",  # SmolVLM processor dependency
]
# live webcam demo (live_demo.py): vlm extra + a web server and the YOLO detector
demo = [
    "patchattack[vlm]",
    "fastapi",
    "uvicorn[standard]",
    "ultralytics",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchattack = ["live_demo.html"]
